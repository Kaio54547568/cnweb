<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Học tiếng Nhật qua video YouTube với phụ đề Nhật–Việt, furigana và sổ tay lưu từ vựng, câu hữu ích cùng tiến độ học."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.png" />
    <title>Kotoba</title>
    <script>
      // Áp dụng chủ đề đã lưu (hoặc theo hệ thống) trước khi vẽ để không bị nháy màu
      (function () {
        try {
          var t = localStorage.getItem("kotoba-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
